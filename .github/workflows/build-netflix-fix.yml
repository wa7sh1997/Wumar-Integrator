name: Build Wumar Netflix Fix
on:
  push:
    paths:
      - 'netflix-fix/**'
      - '.github/workflows/build-netflix-fix.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netflix-fix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Wumar-Netflix-Fix-debug
          path: netflix-fix/app/build/outputs/apk/debug/app-debug.apk
